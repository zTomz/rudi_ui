name: rudi_ui_fonts
description: Optional Google Sans and Unbounded typography assets for Rudi UI.
version: 0.1.0
homepage: https://github.com/zTomz/rudi_ui
repository: https://github.com/zTomz/rudi_ui/tree/main/packages/rudi_ui_fonts
issue_tracker: https://github.com/zTomz/rudi_ui/issues
topics:
  - ui
  - fonts
  - typography

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  rudi_ui: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  fonts:
    - family: GoogleSans
      fonts:
        - asset: assets/fonts/google_sans/GoogleSans-VariableFont_GRAD,opsz,wght.ttf
    - family: Unbounded
      fonts:
        - asset: assets/fonts/unbounded/Unbounded-VariableFont_wght.ttf

