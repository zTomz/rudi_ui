name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        include:
          - flutter-version: '3.47.0'
            flutter-channel: stable
            minimum-version: true
          - flutter-version: ''
            flutter-channel: stable
            minimum-version: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: matrix.flutter-version != ''
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          channel: ${{ matrix.flutter-channel }}
          cache: true
      - if: matrix.flutter-version == ''
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.flutter-channel }}
          cache: true
      - run: flutter pub get
      - run: flutter pub get
        working-directory: example
      - run: dart format --output=none --set-exit-if-changed lib test example tool
      - run: dart analyze --fatal-infos
      - run: dart analyze --fatal-infos
        working-directory: example
      - run: flutter test
      - run: flutter test
        working-directory: example
      - run: dart run tool/check_import_boundaries.dart
      - run: dart run tool/generate_skill_reference.dart --check
      # Dartdoc on Flutter 3.47 has an upstream @docImport failure; restore the doc job when fixed.
      - if: matrix.minimum-version
        run: dart pub global activate pana
      - if: matrix.minimum-version
        run: pana --no-warning .
      - run: dart pub publish --dry-run

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            command: flutter build web --release
          - runner: ubuntu-latest
            command: flutter build apk --debug
          - runner: windows-latest
            command: flutter build windows --debug
          - runner: macos-latest
            command: flutter build macos --debug
          - runner: macos-latest
            command: flutter build ios --debug --no-codesign
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: ${{ matrix.command }}

  verify-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: preview
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: dart analyze --fatal-infos
      - run: flutter test

  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
        working-directory: .
      - run: flutter pub get
      - run: flutter build linux --debug
